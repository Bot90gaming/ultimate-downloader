services:
  ultimate-downloader:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/hoshirun/ultimate-downloader:latest
    container_name: ultimate-downloader
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
      - DOWNLOAD_DIR=/app/downloads
      - CLIENT_DIST=/app/client/dist
      - SIMULTANEOUS_DOWNLOAD_LIMIT=3
      - LOG_LEVEL=info
    volumes:
      - ../downloads:/app/downloads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
